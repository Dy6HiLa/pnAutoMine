# Скопируйте нужные параметры в секцию scoreboard файла plugins/TAB/config.yml.
# TAB получает значения pnAutoMine через PlaceholderAPI.
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    pnautomine:
      display-condition: "%pnautomine_current_exists%=true"
      title: "&b&lАВТОШАХТА"
      lines:
        - "&7Шахта:||%pnautomine_current_name%"
        - "&7Тип:||%pnautomine_current_type_display%"
        - "&7Следующий тип:||%pnautomine_current_next_type_display%"
        - "&7Осталось:||%pnautomine_current_blocks_remaining%/%pnautomine_current_blocks_total%"
        - "&7Добыто:||%pnautomine_current_percentage_mined%%"
        - "&7Сброс:||%pnautomine_current_reset_time%"

# Для scoreboard конкретной шахты замените <id> на её ID, например:
#   %pnautomine_spawn_blocks_remaining%
# Полный список placeholders находится в README.md.
# Пример статистики по материалам: tab-mining-scoreboard-example.yml.
